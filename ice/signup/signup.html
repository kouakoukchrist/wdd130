<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Feed Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: rgb(120, 96, 64);
      font-family: Georgia, serif;
    }

    #formContainer {
      background-color: white;
      border: 10px solid rgb(20, 20, 165);
      border-radius: 25px;
      width: 400px;
      margin: 40px auto;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    #closeBtn {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: white;
      border: none;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .banner {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .banner-msg {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .banner-msg h1 {
      font-size: 28px;
      font-weight: bold;
    }

    .banner-msg h2 {
      font-size: 18px;
      font-weight: normal;
    }

    h3 {
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      justify-content: center;
      gap: 10px;
      width: 85%;
      margin: 0 auto;
    }

    label {
      text-align: right;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"] {
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 100%;
    }

    #gender {
      margin: 10px 0;
    }

    #gender label {
      font-weight: normal;
      margin: 0 5px;
    }

    section {
      margin: 10px 0;
    }

    button[type="submit"] {
      background-color: rgb(20, 20, 165);
      color: white;
      padding: 7px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button[type="submit"]:hover {
      background-color: navy;
    }

    #bottom {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    #bottom img {
      width: 75px;
      height: 100px;
      object-fit: cover;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="formContainer">
    <button id="closeBtn">X</button>

    <img class="banner" src="images/jesus_feeds_5000.jpeg" alt="Jesus">
    <div class="banner-msg">
      <h1>Daily Feed</h1>
      <h2>Scripture a Day</h2>
    </div>

    <h3>Sign Up for Daily Scripture Feed</h3>

    <form id="myForm">
      <label for="username">User Name:</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
    </form>

    <div id="gender">
      <label>Gender:</label>
      <input type="radio" id="male" name="gender" value="male" required />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female" required />
      <label for="female">Female</label>
    </div>

    <section>
      <input type="checkbox" id="newsletter" name="newsletter" />
      <label for="newsletter">Subscribe to newsletter</label>
    </section>

    <section>
      <input type="checkbox" id="conditions" name="conditions" required />
      <label for="conditions">I acknowledge the terms and conditions</label>
    </section>

    <section>
      <button type="submit">Submit</button>
    </section>

    <div id="bottom">
      <img src="images/old_testament.webp" alt="">
      <img src="images/new_testament.webp" alt="">
      <img src="images/book_of_mormon.webp" alt="">
      <img src="images/doctrine_and_covenants.webp" alt="">
      <img src="images/pearl_of_great_price.webp" alt="">
    </div>
  </div>
</body>
</html>
