<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>

    <style>
     
     * {box-sizing: border-box;}

     #Aposle-box{
        background-image: url(images/christus.webp);
        align-items: center;
        background-repeat: no-repeat;
        background-size: cover;
        border: 10px solid black;
        border-radius: 30px;
        max-width: 60%;
        text-align: center;
        margin: 30px auto;
        color: white;
        background-position: 65% 50%;
        }

     #First-Presidency-box{
        margin: .8em;
        

     }
     #First-Presidency-box img{
        border-radius: 50%;
        border: 5px solid white;
        gap: 100%;
        justify-content: center;
        align-items: center;
        justify-items: center;
       
     }

     #quorum-twelve-box {
    display: grid;
    grid-template-columns: 130px 130px 130px 130px;
    justify-content: center;
    align-items: center;
    justify-items: center;
    row-gap: 10px;
}
#quorum-twelve-box img {
    margin: 0 -1px; 
}

#quorum-twelve-box img:hover {
  border-color: gold;
}

    img {
        border: 5px solid white;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 0;
        
    }

        .Medium{
        height: 175px;
        width: 175px;
    }
    .Large{
        height: 250px;
        width: 250px;
    }

    .Small{
        height: 100px;
        width: 100px;
         flex: 0 0 auto;
    }
    
    </style>
</head>
<body>
<div id="Aposle-box">

<div id="First-Presidency-box">

<h1>First Presidency</h1>

<img class="Medium"  src="images/oaks.webp" alt="Dallin Oaks">

<img class="Large" src="images/nelson.webp" alt="President Nelson">

<img class="Medium" src="images/eyring.webp" alt="Henry Eyring">

</div>


<h2>Quorum of the Twelve Apostles</h2>

<div id="quorum-twelve-box">

<img class="Small" src="images/holland.webp" alt="">
<img class="Small" src="images/uchtdorf.webp" alt="">
<img class="Small" src="images/bednar.webp" alt="">
<img class="Small" src="images/cook.webp" alt="">
<img class="Small" src="images/christofferson.webp" alt="">
<img class="Small" src="images/anderson.webp" alt="">
<img class="Small" src="images/rasband.webp" alt="">
<img class="Small" src="images/stevenson.webp" alt="">
<img class="Small" src="images/renlund.webp" alt="">
<img class="Small" src="images/gong.webp" alt="">
<img class="Small" src="images/soares.webp" alt="">
<img class="Small" src="images/kearon.webp" alt="">

</div>

</div>

    <!-- Insert HTML elements here -->
</body>
</html>
