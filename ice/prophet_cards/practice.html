<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #box{
        max-width: 1400px ;
        text-align: center;
        display: flex;
        flex-wrap: wrap ;
        justify-content: center;
        align-items: end;
        gap: 1em;
    }

    #box img{
        border-bottom:50% ;
        width: 300px;
        height: 300px;
        object-fit: cover;
        object-position: 50 10%;
        border: 5px solid purple;

    }
    #h1{
        flex: 1 1 100% ;

    }
    img{
        border: 1px solid red;


    }



</style>



</head>
<body>
    
<div id="box">
<h1>Flex Demo</h1>
<img src="https://placehold.co/350/300" alt="">
<img src="https://placehold.co/350/300" alt="">
<img src="https://placehold.co/350/300" alt="">
</div>





</body>
</html>
